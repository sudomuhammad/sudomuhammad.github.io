# Weekly update PRs, grouped so each ecosystem is one PR to review.
version: 2
updates:
  - package-ecosystem: github-actions # keeps the pinned SHAs in deploy.yml current
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /ml
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
