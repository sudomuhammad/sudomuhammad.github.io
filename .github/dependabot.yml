# Weekly update PRs, grouped so each ecosystem is one PR to review.
version: 2
updates:
  - package-ecosystem: github-actions # keeps the pinned SHAs in deploy.yml current
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only; revisit when it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: uv
    directory: /ml
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
    ignore:
      # Held back on purpose for Intel-Mac wheels; see ml/pyproject.toml.
      - dependency-name: numba
      - dependency-name: llvmlite
      - dependency-name: numpy
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
